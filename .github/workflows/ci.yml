name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # The plugin needs tmux 3.8, newer than the runners' packages: build it.
  TMUX_VERSION: "3.8"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The checkout lands in a directory named agent-status.tmux (the repo
      # name), which test-hooks.sh relies on to tell plugin hooks apart.
      - uses: actions/checkout@v5

      - name: Install build deps, jq and shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config jq shellcheck
      - name: Install build deps, jq and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install libevent utf8proc pkg-config bison jq shellcheck

      - name: Build tmux
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" | tar xz
          cd "tmux-$TMUX_VERSION"
          # macOS needs an explicit utf8proc choice; Homebrew's tmux enables it.
          if [ "$RUNNER_OS" = macOS ]; then utf8=--enable-utf8proc; else utf8=; fi
          ./configure --prefix="$HOME/.local" $utf8
          make -j4
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Versions
        run: tmux -V; jq --version; shellcheck --version | head -2; bun --version; bash --version | head -1

      - name: Lint
        run: |
          scripts=$(git ls-files '*.sh' agent-status.tmux)
          for f in $scripts; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -S warning $scripts

      - name: Test
        run: bash tests/run.sh
